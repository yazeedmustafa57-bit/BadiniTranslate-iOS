name: BadiniTranslate
options:
  bundleIdPrefix: com.badini.translate
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: "BadiniTranslate/Info.plist"
    DEVELOPMENT_TEAM: ""  # ← HIER DEINE TEAM-ID EINTRAGEN

targets:
  BadiniTranslate:
    type: application
    platform: iOS
    sources:
      - BadiniTranslate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.badini.translate.ios"
        INFOPLIST_FILE: "BadiniTranslate/Info.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    info:
      path: BadiniTranslate/Info.plist
